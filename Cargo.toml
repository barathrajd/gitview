[package]
name = "gitview"
version = "0.3.1"
edition = "2024"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
crossterm-keybind = "0.4.4"
serde = { version = "1.0", features = ["derive"] }

[features]
test-support = []

[dev-dependencies]
libc = "0.2"

[[bin]]
name = "terminal_panic_probe"
path = "tests/support/terminal_panic_probe.rs"
required-features = ["test-support"]
test = false
bench = false

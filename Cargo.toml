[package]
name = "gitview"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Keyboard-first terminal interface for reviewing Git history and working-tree changes"
repository = "https://github.com/barathrajd/gitview"
readme = "README.md"
keywords = ["git", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
crossterm-keybind = "0.4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
shell-words = "1"
tempfile = "3"
portable-pty = "0.9.0"
vt100 = "0.18.1"
notify = "8.2.1"
libc = "0.2"

[features]
test-support = []

[dev-dependencies]

[[bin]]
name = "terminal_panic_probe"
path = "tests/support/terminal_panic_probe.rs"
required-features = ["test-support"]
test = false
bench = false

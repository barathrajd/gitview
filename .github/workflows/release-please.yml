name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pre-release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked --features test-support
      - name: Run Clippy
        run: >-
          cargo clippy --locked --all-targets --features test-support --
          -D warnings -A clippy::too_many_arguments
      - name: Check CLI help
        run: cargo run --locked --bin gitview -- --help
      - name: Check installer help
        run: |
          bash -n install.sh
          bash install.sh --help
      - name: Check crate package
        run: cargo publish --dry-run --locked --allow-dirty

  release-please:
    needs: pre-release-checks
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos-arm64:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package release
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test "$(uname -m)" = "arm64"
          cargo build --release --locked
          archive="gitview-${TAG_NAME}-macos-arm64.tar.gz"
          staging_dir="$(mktemp -d)"
          cp target/release/gitview "$staging_dir/"
          tar -czf "$archive" -C "$staging_dir" gitview
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  publish-crate:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish package to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
